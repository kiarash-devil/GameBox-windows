name: Build Windows EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        shell: pwsh
        run: |
          Expand-Archive GameBoxWindows.zip -DestinationPath src
          $p = (Get-ChildItem src -Recurse -Filter package.json | Select-Object -First 1).DirectoryName
          "PROJ=$p" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        shell: pwsh
        run: |
          cd $env:PROJ
          npm install
          npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: GameBox-exe
          path: ${{ env.PROJ }}/dist/GameBox-Setup.exe
